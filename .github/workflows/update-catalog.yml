name: Update catalog

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Madagasikara
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Alaivo ny lisitra
        run: python scripts/update_catalog.py
      - name: Commit raha niova
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add produits.json
          git diff --cached --quiet || (git commit -m "Fanavaozana katalaogy $(date -u +%F)" && git push)
